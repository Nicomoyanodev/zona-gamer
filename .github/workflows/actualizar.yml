name: Actualizar catálogo

on:
  schedule:
    - cron: '0 */4 * * *'  # cada 4 horas (00, 04, 08, 12, 16, 20 UTC = 21, 01, 05, 09, 13, 17 hs Argentina)
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bajar Excel, buscar portadas nuevas y generar catálogo
        run: node scripts/build.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - name: Guardar portadas nuevas en el repo
        run: |
          git config user.name "zona-gamer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/image-cache.json
          git diff --cached --quiet || (git commit -m "Portadas nuevas [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
